<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141519">
<title>coach-os · treino</title>
<style>
  :root{
    --bg:#141519; --surface:#1C1E24; --surface2:#23262D; --line:#2E323B;
    --text:#EAE7E1; --dim:#8B909B; --faint:#565B66; --amber:#EE7B30; --amber-ink:#141519; --ok:#6FA471; --err:#D05050;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font-family:inherit; cursor:pointer}
  #app{max-width:620px; margin:0 auto; padding:0 16px 150px}
  .kicker{font-size:11px; letter-spacing:3px; color:var(--amber); text-transform:uppercase; font-weight:700}
  .card{border:1px solid var(--line); border-radius:14px; background:var(--surface)}
  input{background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:10px;
    padding:11px 12px; font-size:14px; width:100%}
  input:focus{outline:none; border-color:var(--amber)}
  .demo2{animation:fx 1.7s steps(1) infinite}
  @keyframes fx{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timerbar"></div>
<div id="toast" style="position:fixed;top:12px;left:12px;right:12px;z-index:60;display:none"></div>
<script>
// ── coach-app · superfície de captura do coach-os ──────────────────────
// Prioridade do treino exibido: treino/hoje.json (montado pelo coach) →
// template do dia da semana pelo `cronograma` de treino/planos/current.json → NENHUM.
// Nunca inventar treino: dia sem treino montado mostra estado vazio explícito, não fallback silencioso.
// Sessão finalizada → commit em treino/logs/AAAA-MM/AAAA-MM-DD-<slug>.json
// Demonstrações: free-exercise-db (domínio público) — pares de foto animados (posição inicial ↔ final).
// campo demo: ["Dir/0.jpg","Dir/1.jpg"] (relativo à RAW) ou URL http completa.
const BUILD="2026-07-25e";
const OWNER="Sants-M13", REPO="coach-os", API="https://api.github.com";
const RAW="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const RAW_DB="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";

const FALLBACK_PLAN={
  plano:"A — KB puro (fase de aprendizado)",
  warmup:[
    {name:"Halo",dose:"5 / direção",desc:"KB circula em volta da cabeça, perto. Acorda o ombro."},
    {name:"Figure 8",dose:"30 s",desc:"Desenha um 8 entre as pernas, mão em mão. Hinge, costas retas.",demo:["Kettlebell_Figure_8/0.jpg","Kettlebell_Figure_8/1.jpg"]},
    {name:"Around the world",dose:"5 / direção",desc:"Volta na cintura, mão em mão atrás. Tronco parado, só o KB gira."},
    {name:"Goblet squat",dose:"5 lentos",desc:"Embaixo do queixo, desce controlado.",demo:["Goblet_Squat/0.jpg","Goblet_Squat/1.jpg"]},
    {name:"Swing leve",dose:"10",desc:"Ativa o hinge antes do trabalho pesado.",demo:["One-Arm_Kettlebell_Swings/0.jpg","One-Arm_Kettlebell_Swings/1.jpg"]}],
  warmup_b_extra:[
    {name:"Círculos de ombro",dose:"10 / lado",desc:"Ombro precisa acordar mais — tem get-up e press hoje."},
    {name:"Get-up parcial vazio",dose:"3 / lado",desc:"Só até o cotovelo e volta. Sem peso."}],
  templates:{
    A:{label:"Balístico",sub:"hinge + potência",days:"Seg · Qui",ex:[
      {id:"swing1",name:"KB Swing",w:24,hint:"24 kg",sets:5,reps:"10",rest:75,demo:["One-Arm_Kettlebell_Swings/0.jpg","One-Arm_Kettlebell_Swings/1.jpg"]},
      {id:"goblet",name:"Goblet squat",w:16,hint:"16 → 24 kg",sets:4,reps:"8",rest:60,demo:["Goblet_Squat/0.jpg","Goblet_Squat/1.jpg"]},
      {id:"clean",name:"Clean unilateral",w:16,hint:"16 kg",sets:3,reps:"5 / lado",rest:60,demo:["One-Arm_Kettlebell_Clean/0.jpg","One-Arm_Kettlebell_Clean/1.jpg"]},
      {id:"swing2",name:"KB Swing — fechar",w:24,hint:"24 kg",sets:3,reps:"10",rest:75,demo:["One-Arm_Kettlebell_Swings/0.jpg","One-Arm_Kettlebell_Swings/1.jpg"]}]},
    B:{label:"Grind",sub:"técnica + força lenta",days:"Ter · Sex",ex:[
      {id:"getup",name:"Turkish get-up",w:16,hint:"16 kg ou vazio",sets:5,reps:"1 / lado",rest:90,demo:["Kettlebell_Turkish_Get-Up_Squat_style/0.jpg","Kettlebell_Turkish_Get-Up_Squat_style/1.jpg"],
       note:"Progressão: punho vazio → garrafinha no punho → 16 kg só quando o padrão sair fluido. Não força."},
      {id:"press",name:"Military press unilateral",w:16,hint:"16 kg",sets:4,reps:"5 / lado",rest:75,demo:["Alternating_Kettlebell_Press/0.jpg","Alternating_Kettlebell_Press/1.jpg"]},
      {id:"row",name:"Single-arm row",w:24,hint:"24 kg",sets:4,reps:"8 / lado",rest:60,demo:["One-Arm_Kettlebell_Row/0.jpg","One-Arm_Kettlebell_Row/1.jpg"]},
      {id:"gobletB",name:"Goblet squat",w:16,hint:"16 kg",sets:3,reps:"10",rest:60,demo:["Goblet_Squat/0.jpg","Goblet_Squat/1.jpg"]}]}},
  regras:["Nunca à falha — deixa 2-3 reps no tanque","Anota a carga — busca +1 rep ou +carga toda semana","Proteína ~180 g no dia · déficit moderado"]
};

// ── estado ──
let PLAN=FALLBACK_PLAN, HOJE=null, planSource="embutido";
let day=null, checks={}, reps={}, weights={}, warmOpen=true, startedAt=null, endedAt=null, finalized=false;
let pressState=null;
let timer=null, timerInterval=null, wakeLock=null, timerFired=false;
let showConfig=false, uploading=false;
let gifOpen={}, gifCache={}, obsOpen={};
let obs={};   // `${day}|${ex.id}` → texto livre que o Matheus escreve pro coach
let wbase={}; // ex.id → o ex.w que o override em weights[] tomou como base

const todayStr=()=>new Date().toLocaleDateString("en-CA");
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
             set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
             del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const token=()=>store.get("gh-token")||"";

const WD=["dom","seg","ter","qua","qui","sex","sab"];
// Dia da semana → chave de template, lida do `cronograma` do plano vigente (seg:"U", ter:"L", ...).
// Retorna null quando o dia não tem treino de força (zone2/off) ou o plano não bate — NUNCA chuta um template.
function weekdayDay(){
  const t=PLAN.templates||{};
  const k=(PLAN.cronograma||{})[WD[new Date().getDay()]];
  return (k&&t[k])?k:null;
}
function currentView(){
  if(day==="HOJE"&&HOJE)return{label:HOJE.titulo||"Treino de hoje",sub:HOJE.sub||"",ex:HOJE.ex||[],
    warmup:HOJE.warmup||PLAN.warmup,nota:HOJE.nota_coach||null};
  const t=(PLAN.templates||{})[day];
  if(!t)return{label:"Sem treino montado pra hoje",sub:"o coach não montou o dia — escolhe um template abaixo",
    ex:[],warmup:PLAN.warmup||[],nota:null,vazio:true};
  const warm=day==="B"?[...PLAN.warmup,...(PLAN.warmup_b_extra||[])]:PLAN.warmup;
  return{label:`Dia ${day} · ${t.label}`,sub:(t.sub||"")+" · "+(t.days||""),ex:t.ex,warmup:warm,nota:null};
}

function loadSession(){
  const kw=JSON.parse(store.get("kb-weights")||"{}");
  // formato novo {w,base}; formato antigo era um mapa plano — migra sem base, então os
  // overrides herdados são descartados e a prescrição do coach volta a valer
  if(kw&&typeof kw==="object"&&kw.w){weights=kw.w||{};wbase=kw.base||{};}
  else{weights=kw||{};wbase={};}
  try{
    const s=JSON.parse(store.get("kb-session")||"null");
    if(s&&s.date===todayStr()){checks=s.checks||{};reps=s.reps||{};obs=s.obs||{};day=s.day||weekdayDay();startedAt=s.startedAt||null;endedAt=s.endedAt||null;finalized=!!s.finalized;}
    else{day=weekdayDay();}
  }catch(e){day=weekdayDay();}
}
function saveSession(){
  store.set("kb-weights",JSON.stringify({w:weights,base:wbase}));
  store.set("kb-session",JSON.stringify({date:todayStr(),day,checks,reps,obs,startedAt,endedAt,finalized}));
}

// ── som + vibração ──
function ping(){try{const Ctx=window.AudioContext||window.webkitAudioContext;const ctx=new Ctx();
  [0,0.18].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
    o.type="sine";o.frequency.value=880;const s=ctx.currentTime+t;
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.35,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,s+0.14);o.start(s);o.stop(s+0.16);});}catch(e){}}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ── timer ──
function startRest(secs,label){
  timerFired=false;
  timer={endsAt:Date.now()+secs*1000,total:secs,label};
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(tickTimer,200);
  if(navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>wakeLock=w).catch(()=>{});
  renderTimer();
}
function stopTimer(){
  timer=null;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  if(wakeLock){try{wakeLock.release()}catch(e){} wakeLock=null;}
  renderTimer();
}
function tickTimer(){
  if(!timer)return;
  const rem=Math.max(0,Math.round((timer.endsAt-Date.now())/1000));
  if(rem<=0&&!timerFired){timerFired=true;ping();buzz([120,60,120]);stopTimer();return;}
  renderTimer();
}

// ── GitHub API ──
async function gh(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{
    "Authorization":"Bearer "+token(),"Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28",...(opts.headers||{})}});
  if(!r.ok&&r.status!==404)throw new Error("GitHub "+r.status);
  return r;
}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s)));

async function fetchRepoJson(path){
  const r=await gh(`/repos/${OWNER}/${REPO}/contents/${path}`);
  if(r.status===404)return null;
  const j=await r.json();
  return JSON.parse(unb64(j.content.replace(/\n/g,"")));
}
async function fetchPlan(){
  if(!token())return;
  try{
    const p=await fetchRepoJson("treino/planos/current.json");
    if(p&&p.templates){
      PLAN=p;planSource="coach-os";
      // plano novo pode não ter a chave que estava selecionada (ex.: A/B da fase antiga vs U/L) → recalcula
      if(day!=="HOJE"&&!PLAN.templates[day])day=weekdayDay();
    }
  }catch(e){}
  try{
    const h=await fetchRepoJson("treino/hoje.json");
    if(h&&h.data===todayStr()&&Array.isArray(h.ex)&&h.ex.length){
      HOJE=h;planSource="coach-os";
      const hadChecks=Object.keys(checks).some(k=>checks[k])||Object.keys(reps).length>0;
      if(!hadChecks)day="HOJE";
    }
  }catch(e){}
  render();
}

// ── Demonstração (free-exercise-db, domínio público) ──
let _DEMOS={}, EXDB=null;
function toggleGif(id,name){
  gifOpen[id]=!gifOpen[id];
  if(gifOpen[id]&&!_DEMOS[id]&&gifCache[id]===undefined)searchDemo(id,name);
  render();
}
async function searchDemo(id,name){
  gifCache[id]="loading";
  try{
    if(!EXDB){const r=await fetch(RAW_DB);EXDB=await r.json();}
    const toks=name.toLowerCase().replace(/[—–-]/g," ").replace(/\bkb\b/g,"kettlebell").split(/\s+/).filter(Boolean);
    let best=null,bs=0;
    for(const e of EXDB){
      const n=e.name.toLowerCase();
      const s=toks.filter(t=>n.includes(t)).length;
      if(s>bs){bs=s;best=e;}
    }
    gifCache[id]=(best&&best.images&&bs>=Math.ceil(toks.length/2))?best.images:"none";
  }catch(e){gifCache[id]="none";}
  render();
}
function gifBlock(id){
  if(!gifOpen[id])return"";
  const d=_DEMOS[id]||gifCache[id];
  if(d==="loading"||d===undefined)return`<div style="margin-top:10px;font-size:12px;color:var(--faint)">buscando demonstração…</div>`;
  if(d==="none")return`<div style="margin-top:10px;font-size:12px;color:var(--faint)">demonstração não encontrada</div>`;
  const urls=(Array.isArray(d)?d:[d]).map(u=>/^https?:/.test(u)?u:RAW+u);
  if(urls.length>1)return`<div style="margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;position:relative">
      <img src="${urls[0]}" alt="posição inicial" style="width:100%;display:block" loading="lazy">
      <img src="${urls[1]}" alt="posição final" class="demo2" style="position:absolute;left:0;top:0;width:100%" loading="lazy">
    </div><div class="mono" style="margin-top:4px;font-size:10px;color:var(--faint)">posição inicial ↔ final</div>`;
  return`<div style="margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff">
    <img src="${urls[0]}" alt="demonstração do movimento" style="width:100%;display:block" loading="lazy"></div>`;
}

// ── sessão → coach-os ──
function buildSessionJson(){
  const v=currentView();
  const exercicios=v.ex.map(ex=>{
    const repsArr=Array.from({length:ex.sets},(_,i)=>reps[`${day}|${ex.id}|${i}`]??null);
    const done=repsArr.filter(v=>v!==null).length;
    const o=(obs[obsKey(ex.id)]||"").trim();
    const linha={exercicio:ex.name,carga:effW(ex.id,ex.w),unidade:ex.unit||"kg",series_plano:ex.sets,series_feitas:done,reps_alvo:ex.reps,reps_series:repsArr,descanso_s:ex.rest};
    if(o)linha.obs=o;   // texto livre do Matheus pro coach ler no /coach-semana
    return linha;
  });
  const warmDone=v.warmup.filter((_,i)=>checks[`${day}|wu|${i}`]).length;
  const dur=startedAt?Math.round(((endedAt||Date.now())-startedAt)/60000):null;
  return {
    data:todayStr(),plano:PLAN.plano||"",template:v.label,
    origem_treino:day==="HOJE"?((HOJE&&HOJE.origem)||"coach (hoje.json)"):"template "+day,
    aquecimento:`${warmDone}/${v.warmup.length}`,duracao_min:dur,
    exercicios,origem:"coach-app",registrado_em:new Date().toISOString()
  };
}
async function putJson(path,obj,msg){
  let sha;
  const head=await gh(`/repos/${OWNER}/${REPO}/contents/${path}`);
  if(head.status!==404){sha=(await head.json()).sha;}
  const body={message:msg,content:b64(JSON.stringify(obj,null,2))};
  if(sha)body.sha=sha;
  const put=await gh(`/repos/${OWNER}/${REPO}/contents/${path}`,{method:"PUT",body:JSON.stringify(body)});
  if(!put.ok)throw new Error("PUT "+put.status);
}
async function finalizeSession(){
  if(!token()){showConfig=true;render();toast("Configura o token do GitHub primeiro (⚙).","err");return;}
  if(startedAt&&!endedAt)endedAt=Date.now();   // congela o cronômetro no clique, não na hora do upload
  uploading=true;render();
  const s=buildSessionJson();
  const slug=day==="HOJE"?"hoje":day.toLowerCase();
  const path=`treino/logs/${s.data.slice(0,7)}/${s.data}-${slug}.json`;
  try{
    await putJson(path,s,`treino: ${s.template} ${s.data} (coach-app)`);
    finalized=true;store.del("pending-session");saveSession();
    buzz(60);toast("Treino registrado no coach-os ✓","ok");
  }catch(e){
    store.set("pending-session",JSON.stringify({path,session:s}));
    toast("Sem conexão com o GitHub — sessão guardada no celular. Tenta de novo depois.","err");
  }
  uploading=false;render();
}
async function retryPending(){
  const p=store.get("pending-session");if(!p||!token())return;
  try{
    const {path,session}=JSON.parse(p);
    await putJson(path,session,`treino: sessão ${session.data} (coach-app, retry)`);
    store.del("pending-session");toast("Sessão pendente enviada ✓","ok");render();
  }catch(e){}
}

// ── interações ──
function toggleWarm(i){checks[`${day}|wu|${i}`]=!checks[`${day}|wu|${i}`];if(!startedAt)startedAt=Date.now();saveSession();render();}
// ── cronômetro global do treino ──
// startedAt é setado na 1ª marcação (toggleWarm ou adjustSet); endedAt congela ao finalizar.
// Atualiza só o nó de texto a cada segundo — não re-renderiza a tela inteira.
function elapsedMs(){return startedAt?((endedAt||Date.now())-startedAt):0;}
function fmtElapsed(ms){
  const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`:`${m}:${String(sec).padStart(2,"0")}`;
}
function tickElapsed(){
  const el=document.getElementById("elapsed");if(!el)return;
  el.textContent=startedAt?fmtElapsed(elapsedMs()):"—";
}
setInterval(tickElapsed,1000);

function repTarget(str){const n=(String(str).match(/\d+/g)||[]).map(Number);return n.length?n[n.length-1]:10;}
function adjustSet(exId,rest,name,i,tgt,dir){
  const k=`${day}|${exId}|${i}`;const cur=reps[k];let firstLog=false;
  if(cur===undefined){reps[k]=tgt;firstLog=true;}
  else if(dir>0){reps[k]=Math.min(50,cur+1);}
  else if(cur<=1){delete reps[k];}
  else{reps[k]=cur-1;}
  if(!startedAt)startedAt=Date.now();
  if(firstLog){buzz(15);startRest(rest,name);}else{buzz(8);}
  saveSession();render();
}
function setDown(exId,rest,name,i,tgt,ev){
  if(ev&&ev.preventDefault)ev.preventDefault();
  if(pressState)clearTimeout(pressState.timer);
  pressState={long:false};
  pressState.timer=setTimeout(()=>{pressState.long=true;adjustSet(exId,rest,name,i,tgt,1);},420);
}
function setUp(exId,rest,name,i,tgt,ev){
  if(ev&&ev.preventDefault)ev.preventDefault();
  if(!pressState)return;
  clearTimeout(pressState.timer);const wasLong=pressState.long;pressState=null;
  if(!wasLong)adjustSet(exId,rest,name,i,tgt,-1);
}
function setCancel(){if(pressState){clearTimeout(pressState.timer);pressState=null;}}
function stepW(id,base,unit,dir){
  const cur=effW(id,base);
  // halter/barra: passo 2,5 e snap na grade de 2,5. O app mostra POR LADO, e por lado o menor
  // incremento real do Matheus é 2,5 lb (tem 4 anilhas de 2,5 — ver perfil/anamnese.md).
  // Progressão continua sendo +5 lb (ops/policies.yaml); 2,5 existe pra REGISTRAR o que foi feito.
  if(unit==="lb"){const g=2.5;weights[id]=Math.max(g,Math.round((Math.round(cur/g)*g+dir*g)*10)/10);}
  else{weights[id]=dir>0?24:16;} // kettlebell: só existe 16 e 24 kg
  wbase[id]=base;   // carimba de qual prescrição esse override saiu
  saveSession();render();
}
// Carga exibida. O ajuste no ± persiste entre sessões (comodidade), MAS se o coach mudar a
// prescrição daquele exercício, a prescrição ganha e o override velho é descartado.
// Sem isso um valor salvo em qualquer sessão passada sobrepõe o hoje.json calado — foi o que
// fez a elevação lateral sair 15 lb em 25/jul quando o coach tinha prescrito 10.
function effW(id,base){return (wbase[id]===base&&weights[id]!=null)?weights[id]:base;}

function obsKey(id){return `${day}|${id}`;}
function toggleObs(id){
  obsOpen[id]=!obsOpen[id];render();
  if(obsOpen[id]){const t=document.getElementById("obs-"+id);if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}}
}
// grava SEM re-render: re-render no oninput mataria o foco e o cursor no meio da digitação
function setObs(id,val){const k=obsKey(id);if(val.trim())obs[k]=val;else delete obs[k];saveSession();}

function setDay(d){day=d;saveSession();render();}
function resetSession(){stopTimer();checks={};reps={};obs={};obsOpen={};startedAt=null;endedAt=null;finalized=false;saveSession();render();}
function saveToken(){
  const v=document.getElementById("tok").value.trim();
  if(v)store.set("gh-token",v);else store.del("gh-token");
  showConfig=false;render();fetchPlan();retryPending();
}
function toast(msg,kind){
  const t=document.getElementById("toast");
  t.style.display="block";
  t.innerHTML=`<div style="max-width:620px;margin:0 auto;background:var(--surface2);border:1px solid var(${kind==="ok"?"--ok":"--err"});border-radius:12px;padding:12px 14px;font-size:13.5px">${msg}</div>`;
  setTimeout(()=>{t.style.display="none"},4000);
}

// ── render ──
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
  const v=currentView();
  _DEMOS={};
  v.warmup.forEach((m,i)=>{if(m.demo||m.gif)_DEMOS["wu"+i]=m.demo||m.gif;});
  v.ex.forEach(ex=>{if(ex.demo||ex.gif)_DEMOS[ex.id]=ex.demo||ex.gif;});
  const totalSets=v.ex.reduce((a,e)=>a+e.sets,0);
  const doneSets=v.ex.reduce((a,e)=>a+Array.from({length:e.sets}).filter((_,i)=>reps[`${day}|${e.id}|${i}`]!==undefined).length,0);
  const pct=totalSets?Math.round(doneSets/totalSets*100):0;
  const hasTok=!!token();

  let h=`
  <header style="padding-top:22px;padding-bottom:6px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <div>
        <div class="kicker">${esc(PLAN.plano||"coach-os")}</div>
        <h1 style="margin:4px 0 0;font-size:24px;font-weight:800;letter-spacing:-0.5px">${esc(v.label)}</h1>
        ${v.sub?`<div style="font-size:12.5px;color:var(--dim);margin-top:2px">${esc(v.sub)}</div>`:""}
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="showConfig=!showConfig;render()" aria-label="Configurações"
          style="background:transparent;border:1px solid var(--line);color:${hasTok?"var(--ok)":"var(--amber)"};font-size:15px;width:34px;height:34px;border-radius:8px">⚙</button>
        <button onclick="resetSession()"
          style="background:transparent;border:1px solid var(--line);color:var(--dim);font-size:11px;padding:6px 10px;border-radius:8px;white-space:nowrap">Reiniciar</button>
      </div>
    </div>
    ${v.nota?`<p style="margin:10px 0 0;font-size:12.5px;color:var(--amber);line-height:1.55;background:rgba(238,123,48,.08);border:1px solid rgba(238,123,48,.2);border-radius:9px;padding:9px 11px">${esc(v.nota)}</p>`:""}
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--faint);line-height:1.5">
      Plano: <span class="mono" style="color:var(--dim)">${planSource}</span> · ${todayStr()} · <span class="mono" style="color:var(--faint)">v${BUILD}</span></p>
  </header>`;

  if(showConfig){
    h+=`<section class="card" style="margin-top:12px;padding:15px">
      <div style="font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:9px">Conexão com o coach-os</div>
      <p style="margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.55">
        Token fine-grained do GitHub com acesso <b>só ao repo coach-os</b> (Contents: read/write).
        Fica salvo apenas neste celular.</p>
      <input id="tok" type="password" placeholder="github_pat_..." value="${esc(token())}">
      <div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="saveToken()" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--amber);background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:14px">Salvar</button>
        <button onclick="showConfig=false;render()" style="padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:14px">Fechar</button>
      </div></section>`;
  }

  h+=`<div style="display:flex;gap:8px;margin-top:16px">`;
  if(HOJE){
    const act=day==="HOJE";
    h+=`<button onclick="setDay('HOJE')" style="flex:1.2;padding:10px 8px;border-radius:10px;border:1px solid ${act?"var(--amber)":"var(--line)"};background:${act?"var(--amber)":"transparent"};color:${act?"var(--amber-ink)":"var(--dim)"}">
      <div style="font-weight:800;font-size:14px">★ Hoje</div>
      <div style="font-size:10.5px;opacity:.85;margin-top:1px">montado pelo coach</div></button>`;
  }
  for(const d of Object.keys(PLAN.templates)){
    const t=PLAN.templates[d],act=day===d;
    h+=`<button onclick="setDay('${d}')" style="flex:1;padding:10px 8px;border-radius:10px;border:1px solid ${act?"var(--amber)":"var(--line)"};background:${act?"var(--amber)":"transparent"};color:${act?"var(--amber-ink)":"var(--dim)"}">
      <div style="font-weight:800;font-size:14px">${d} · ${esc(t.label)}</div>
      <div style="font-size:10.5px;opacity:.85;margin-top:1px">${esc(t.days||"")}</div></button>`;
  }
  h+=`</div>`;

  // plano não carregou do coach-os → avisar em vez de fingir que o embutido é o plano vigente
  if(planSource==="embutido"){
    h+=`<div style="margin-top:12px;font-size:12.5px;color:var(--err);line-height:1.55;border:1px solid rgba(208,80,80,.35);background:rgba(208,80,80,.07);border-radius:10px;padding:10px 12px">
      <b>Plano não carregou do coach-os.</b> O que aparece abaixo é o plano embutido no app (fase A antiga, KB puro) —
      ${token()?"não é o teu plano vigente. Confere a conexão e recarrega.":"configura o token no ⚙ pra puxar o plano de verdade."}</div>`;
  }
  if(v.vazio){
    h+=`<section class="card" style="margin-top:16px;padding:16px">
      <div style="font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px">Nada montado pra hoje</div>
      <p style="margin:0;font-size:13px;color:var(--dim);line-height:1.6">
        O coach não montou <span class="mono">treino/hoje.json</span> pra <span class="mono">${todayStr()}</span>${(PLAN.cronograma||{})[WD[new Date().getDay()]]?"":", e o cronograma não tem treino de força hoje"}.
        Antes o app inventava um treino velho aqui — agora ele te fala.<br><br>
        Quer treinar mesmo assim? Escolhe um template nos botões acima. Ou pede pro coach montar o dia.</p>
    </section>`;
  }

  h+=`<div style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:6px">
      <span style="letter-spacing:1.5px;text-transform:uppercase">Trabalho de hoje</span>
      <span class="mono"><span id="elapsed" style="color:${startedAt?(finalized?"var(--ok)":"var(--amber)"):"var(--faint)"};font-weight:700">${startedAt?fmtElapsed(elapsedMs()):"—"}</span>${finalized?" total":""} · ${doneSets}/${totalSets} séries · ${pct}%</span></div>
    <div style="height:6px;background:var(--surface2);border-radius:99px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:var(--amber);border-radius:99px;transition:width .3s ease"></div></div></div>`;

  h+=`<section class="card" style="margin-top:18px;overflow:hidden">
    <button onclick="warmOpen=!warmOpen;render()" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:transparent;border:none;color:var(--text)">
      <span style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase">Aquecimento</span>
        <span class="mono" style="font-size:11px;color:var(--faint)">~5 min · 16 kg</span></span>
      <span style="color:var(--dim);font-size:13px">${warmOpen?"▾":"▸"}</span></button>`;
  if(warmOpen){
    h+=`<div style="padding:0 8px 8px">`;
    v.warmup.forEach((m,i)=>{
      const on=!!checks[`${day}|wu|${i}`];
      h+=`<div style="${i?"border-top:1px solid var(--line);":""}">
        <button onclick="toggleWarm(${i})" style="width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;padding:9px 8px;background:transparent;border:none;color:var(--text)">
        <span style="margin-top:1px;width:18px;height:18px;border-radius:5px;flex-shrink:0;border:1.5px solid ${on?"var(--amber)":"var(--faint)"};background:${on?"var(--amber)":"transparent"};color:var(--amber-ink);font-size:12px;line-height:15px;text-align:center;font-weight:800">${on?"✓":""}</span>
        <span style="flex:1"><span style="display:flex;justify-content:space-between;gap:8px">
          <span style="font-weight:600;font-size:14px;opacity:${on?".5":"1"};text-decoration:${on?"line-through":"none"}">${esc(m.name)}</span>
          <span class="mono" style="font-size:12.5px;color:var(--amber);white-space:nowrap">${esc(m.dose)}</span></span>
          <span style="display:block;font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.45">${esc(m.desc)}</span></span></button>
        ${_DEMOS["wu"+i]?`<div style="padding:0 8px 8px 37px"><button onclick="toggleGif('wu${i}','${esc(m.name)}')" style="background:transparent;border:none;color:var(--faint);font-size:11px;padding:0">${gifOpen["wu"+i]?"▾ esconder movimento":"▸ ver movimento"}</button>${gifBlock("wu"+i)}</div>`:""}
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</section>`;

  h+=`<div style="margin-top:18px;display:flex;flex-direction:column;gap:12px">`;
  v.ex.forEach((ex,idx)=>{
    const w=effW(ex.id,ex.w);
    const unit=ex.unit||"kg";
    const tgt=repTarget(ex.reps);
    const repVals=Array.from({length:ex.sets},(_,i)=>reps[`${day}|${ex.id}|${i}`]);
    const marks=repVals.map(v=>v!==undefined);
    const exDone=marks.every(Boolean);
    const nextIdx=marks.findIndex(x=>!x);
    const temObs=!!(obs[obsKey(ex.id)]||"").trim();
    h+=`<section class="card" style="border-color:${exDone?"var(--amber)":"var(--line)"};padding:15px;opacity:${exDone?".78":"1"}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <button onclick="toggleGif('${ex.id}','${esc(ex.name)}')" style="display:flex;align-items:baseline;gap:8px;background:transparent;border:none;color:var(--text);padding:0;text-align:left">
          <span class="mono" style="font-size:12px;color:var(--faint)">${String(idx+1).padStart(2,"0")}</span>
          <h2 style="margin:0;font-size:16.5px;font-weight:700;letter-spacing:-0.3px">${esc(ex.name)} <span style="color:var(--faint);font-size:12px;font-weight:400">${gifOpen[ex.id]?"▾":"▸"}</span></h2></button>
        <span class="mono" style="font-size:12.5px;color:var(--dim);white-space:nowrap">${ex.sets} × ${esc(ex.reps)}</span></div>
      ${gifBlock(ex.id)}`;
    if(ex.note)h+=`<p style="margin:9px 0 0;font-size:12px;color:var(--amber);line-height:1.5;background:rgba(238,123,48,.08);border:1px solid rgba(238,123,48,.2);border-radius:9px;padding:8px 10px">${esc(ex.note)}</p>`;
    h+=`<div style="margin-top:13px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="stepW('${ex.id}',${ex.w},'${unit}',-1)" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:19px;line-height:1">–</button>
        <div style="text-align:center;min-width:52px">
          <div class="mono" style="font-size:22px;font-weight:700;line-height:1">${w}<span style="font-size:11px;color:var(--dim);font-weight:400"> ${unit}</span></div>
          <div style="font-size:9.5px;color:var(--faint);margin-top:2px">plano: ${esc(ex.hint)}</div></div>
        <button onclick="stepW('${ex.id}',${ex.w},'${unit}',1)" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:19px;line-height:1">+</button></div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end">`;
    marks.forEach((on,i)=>{
      const isNext=!on&&i===nextIdx;const a=`'${ex.id}',${ex.rest},'${esc(ex.name)}',${i},${tgt}`;
      h+=`<button onpointerdown="setDown(${a},event)" onpointerup="setUp(${a},event)" onpointercancel="setCancel()" onpointerleave="setCancel()" oncontextmenu="return false" aria-label="Série ${i+1}: ${on?repVals[i]+" reps feitas":"alvo "+tgt+" reps"}"
        style="width:42px;height:42px;border-radius:11px;font-size:15px;font-weight:700;color:${on?"var(--amber-ink)":isNext?"var(--amber)":"var(--dim)"};background:${on?"var(--amber)":"transparent"};border:1.5px solid ${on||isNext?"var(--amber)":"var(--line)"};box-shadow:${isNext?"0 0 0 3px rgba(238,123,48,.13)":"none"};touch-action:none;user-select:none;-webkit-user-select:none" class="mono">${on?repVals[i]:tgt}</button>`;
    });
    h+=`</div></div>
      <div style="margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="mono" style="font-size:10.5px;color:var(--faint)">descanso ${ex.rest}s entre séries</span>
        <button onclick="toggleObs('${ex.id}')" aria-expanded="${obsOpen[ex.id]?"true":"false"}"
          style="background:transparent;border:1px solid ${temObs?"var(--amber)":"var(--line)"};color:${temObs?"var(--amber)":"var(--dim)"};
          font-size:11px;padding:5px 10px;border-radius:8px;white-space:nowrap">${temObs?"●":"+"} obs${obsOpen[ex.id]?" ▾":""}</button>
      </div>
      ${obsOpen[ex.id]?`<textarea id="obs-${ex.id}" oninput="setObs('${ex.id}',this.value)" rows="3"
        placeholder="O que eu preciso saber sobre esse exercício hoje — execução, dor, o que sentiu, o que mudou."
        style="margin-top:9px;width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
        border-radius:10px;padding:10px 11px;font-size:13.5px;line-height:1.5;font-family:inherit;resize:vertical">${esc(obs[obsKey(ex.id)]||"")}</textarea>`:""}
      </section>`;
  });
  h+=`</div>`;

  const canFinish=doneSets>0&&!finalized;
  h+=`<div style="margin-top:20px">
    <button onclick="finalizeSession()" ${canFinish&&!uploading?"":"disabled"}
      style="width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:800;border:1px solid ${finalized?"var(--ok)":"var(--amber)"};
      background:${finalized?"transparent":canFinish?"var(--amber)":"var(--surface2)"};
      color:${finalized?"var(--ok)":canFinish?"var(--amber-ink)":"var(--faint)"};opacity:${uploading?".6":"1"}">
      ${finalized?`✓ Registrado no coach-os${startedAt?" · "+Math.round(elapsedMs()/60000)+" min":""}`:uploading?"Enviando…":"Finalizar treino → registrar"}</button>
    ${store.get("pending-session")?`<button onclick="retryPending()" style="width:100%;margin-top:8px;padding:11px;border-radius:10px;border:1px solid var(--err);background:transparent;color:var(--err);font-size:13px">↻ Reenviar sessão pendente</button>`:""}
  </div>`;

  h+=`<section class="card" style="margin-top:20px;padding:14px 16px">
    <div style="font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:10px">Inegociáveis</div>`;
  (PLAN.regras||[]).forEach((t,i)=>{
    h+=`<div style="display:flex;gap:10px;align-items:flex-start;margin-top:${i?8:0}px">
      <span class="mono" style="color:var(--amber);font-size:12px;margin-top:1px">${i+1}</span>
      <span style="font-size:13px;line-height:1.45">${esc(t)}</span></div>`;
  });
  h+=`</section>
  <p style="text-align:center;font-size:11px;color:var(--faint);margin-top:22px;line-height:1.6;font-style:italic">
    Treino é processo, não evento.<br>Ataca o corpo igual ataca o negócio: com dados.</p>
  <p style="text-align:center;font-size:10px;color:var(--faint);margin-top:8px">Demonstrações: free-exercise-db (domínio público)</p>`;

  document.getElementById("app").innerHTML=h;
}

function renderTimer(){
  const el=document.getElementById("timerbar");
  if(!timer){el.innerHTML="";return;}
  const rem=Math.max(0,Math.round((timer.endsAt-Date.now())/1000));
  el.innerHTML=`<div style="position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 12px 12px">
    <div style="max-width:620px;margin:0 auto;background:var(--surface2);border:1px solid var(--amber);border-radius:16px;padding:12px 14px;box-shadow:0 -8px 30px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div style="min-width:0">
          <div style="font-size:10px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;font-weight:700">Descanso</div>
          <div style="font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(timer.label)}</div></div>
        <div class="mono" style="font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px;color:${rem<=5?"var(--amber)":"var(--text)"}">${fmt(rem)}</div>
        <div style="display:flex;gap:7px">
          <button onclick="timer.endsAt+=15000;timer.total+=15;renderTimer()" style="padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;font-weight:600;white-space:nowrap">+15s</button>
          <button onclick="stopTimer()" style="padding:9px 12px;border-radius:10px;border:1px solid var(--amber);background:var(--amber);color:var(--amber-ink);font-size:13px;font-weight:800;white-space:nowrap">Pular</button></div></div>
      <div style="height:5px;background:var(--surface);border-radius:99px;overflow:hidden;margin-top:11px">
        <div style="width:${(rem/timer.total)*100}%;height:100%;background:var(--amber);border-radius:99px;transition:width .25s linear"></div></div></div></div>`;
}

// ── arranque ──
loadSession();
render();
fetchPlan();
retryPending();
</script>
</body>
</html>
